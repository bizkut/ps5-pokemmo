name: Source release

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

concurrency:
  group: source-release-${{ github.repository_id }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    if: ${{ github.event.created == true && github.event.deleted == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Run offline packaging regressions
        run: python3 -m unittest discover -s tools -p test_release_client_exclusion.py

      - name: Reject official PokeMMO client content
        run: |
          python3 -c \
            'from tools.release_client_guard import reject_official_client_content; reject_official_client_content(".", "repository checkout")'

  publish:
    if: ${{ github.event.created == true && github.event.deleted == false }}
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Preserve or create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view --repo "$GH_REPO" -- "$TAG_NAME" >/dev/null 2>&1; then
            echo "A release for this tag already exists; preserving it."
            exit 0
          fi
          gh release create --repo "$GH_REPO" --verify-tag --generate-notes -- "$TAG_NAME"
